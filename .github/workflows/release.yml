name: Create GitHub Release

on:
  push:
    tags:
      - 'v*' # activating for tags like v1.0.1, v1.1.0, ecc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Get Version Content
        id: get_text
        run: |
          # 1. Extract version from tag (e.g., v2.0.0 -> 2.0.0)
          VERSION="${GITHUB_REF_NAME#v}"
          
          # 2. Extract specific section from CHANGELOG.md
          # It searches from "## [VERSION]" until the next "## [" header
          # Then removes the first line (the version header) and the last line (the next header)
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '1d;$d' > release_notes.txt
          
          # 3. Debug: display the extracted content in the Action logs for verification
          echo "--- Release Notes Extracted ---"
          cat release_notes.txt
          echo "-------------------------------"

      # 1. Preparing Windows package
      - name: Build Windows VSIX
        run: |
          npm install --os=win32 --cpu=x64 sharp
          npx vsce package --target win32-x64 --out image-webify-win32-x64.vsix

      # 2. Preparing macOS (Apple Silicon) package
      - name: Build macOS ARM VSIX
        run: |
          rm -rf node_modules
          npm install --os=darwin --cpu=arm64 sharp
          npx vsce package --target darwin-arm64 --out image-webify-darwin-arm64.vsix

      # 3. Preparing Linux package
      - name: Build Linux VSIX
        run: |
          rm -rf node_modules
          npm install --os=linux --cpu=x64 sharp
          npx vsce package --target linux-x64 --out image-webify-linux-x64.vsix

      # 4. Release Creation
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            image-webify-win32-x64.vsix
            image-webify-darwin-arm64.vsix
            image-webify-linux-x64.vsix
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}